[package]
name = "starlight_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "starlight_native"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
# X11 window discovery, geometry and capture across every Xwayland display (host and nested)
xcb = { version = "1.7", features = ["shm", "composite"] }
libc = "0.2"
# Image resizing and PNG encoding (no system libs required)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# Error types
thiserror = "2"

# Linux-only: libei EIS protocol (pure Rust, re-exports enumflags2)
[target.'cfg(target_os = "linux")'.dependencies]
reis = "0.7"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "remote_desktop", "screencast"] }
futures-lite = "2"
# KWin scripting D-Bus bridge for cursor-position queries (KDE only; see input/cursor.rs)
zbus = "5"
tempfile = "3"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1
